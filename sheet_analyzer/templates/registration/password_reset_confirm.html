{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password - SheetAnalyzer</title>
    <link rel="stylesheet" href="{% static 'sheet_analyzer/style.css' %}">
    <style>body { justify-content: center; align-items: center; }</style>
</head>
<body>
    <div id="aurora"></div>
    <div class="login-container">
        <div class="login-heading">
            <h1 class="login-title">New Password</h1>
            <p class="login-sub">Create a new password for your account.</p>
        </div>
        {% if validlink %}
        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="field-group">
                <label class="field-label">New Password</label>
                {{ form.new_password1 }}
            </div>
            <div class="field-group">
                <label class="field-label">Confirm Password</label>
                {{ form.new_password2 }}
            </div>
            <button type="submit" class="login-btn">Save Password</button>
        </form>
        {% else %}
        <div class="login-error">This reset link is invalid or expired. Please request a new one.</div>
        <p class="login-note"><a href="{% url 'password_reset' %}">Request new link</a></p>
        {% endif %}
    </div>
    <script>
        document.querySelectorAll('input[type="password"]').forEach(input => {
            input.classList.add('field-input');
        });
    </script>
</body>
</html>

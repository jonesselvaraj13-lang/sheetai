{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SheetAnalyzer</title>
    <link rel="stylesheet" href="{% static 'sheet_analyzer/style.css' %}">
    <style>body { justify-content: center; align-items: center; }</style>
</head>
<body>
    <div id="aurora"></div>
    <div class="login-container">
        <div class="login-heading">
            <h1 class="login-title">Reset Password</h1>
            <p class="login-sub">Enter your account email to receive a reset link.</p>
        </div>
        <form method="post" class="login-form">
            {% csrf_token %}
            <div class="field-group">
                <label class="field-label">Email</label>
                <input type="email" name="email" class="field-input" placeholder="Enter your email" autocomplete="email" required>
            </div>
            <button type="submit" class="login-btn">Send Reset Link</button>
        </form>
        <p class="login-note"><a href="{% url 'login' %}">Back to login</a></p>
    </div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetAnalyzer — Login</title>
    <link rel="icon" type="image/x-icon" href="{% static 'sheet_analyzer/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'sheet_analyzer/style.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <!-- Aurora Background -->
    <div id="aurora">
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
    </div>

    <div class="login-container">

        <!-- Logo -->
        <div class="login-logo" style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px;">
            <img class="brand-logo-img brand-logo-img-lg" src="{% static 'sheetai-logo.svg' %}" alt="SheetAnalyzer logo">
            <span class="logo-text" style="font-size:1.5rem;">Sheet<span class="logo-accent">Analyzer</span></span>
        </div>

        <!-- Heading -->
                <div class="login-heading">
                    <h1 class="login-title">Welcome</h1>
                    <p class="login-sub">Sign in to your SheetAnalyzer workspace</p>
                </div>

                {% if error %}
                <div class="login-error">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    {{ error }}
                </div>
                {% endif %}

        <!-- Form -->
                <form method="post" action="/login/" class="login-form">
                    {% csrf_token %}

                    <div class="field-group">
                        <label class="field-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            Username or Email
                        </label>
                        <input
                            type="text"
                            name="username"
                            class="field-input"
                            placeholder="Enter your username or email"
                            autofocus
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="field-group">
                        <label class="field-label">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                            Password
                        </label>
                        <div class="password-wrap">
                            <input
                                type="password"
                                name="password"
                                id="passwordInput"
                                class="field-input"
                                placeholder="Enter your password"
                                autocomplete="current-password"
                                required
                            >
                            <button type="button" class="toggle-pw" id="togglePw" title="Show/hide password">
                                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <button type="submit" class="login-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
                            <polyline points="10 17 15 12 10 7"></polyline>
                            <line x1="15" y1="12" x2="3" y2="12"></line>
                        </svg>
                        Sign In
                    </button>
                </form>

                <p class="login-note"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
                <p class="login-note">Don't have an account? Ask your administrator to create one.</p>

            </div>
        </div>

    </div>

    <script>
        const togglePw = document.getElementById('togglePw');
        const passwordInput = document.getElementById('passwordInput');
        const eyeIcon = document.getElementById('eyeIcon');

        togglePw.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword
                ? `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`
                : `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
        });
    </script>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SheetAnalyzer — Change Password</title>
    <link rel="icon" type="image/x-icon" href="{% static 'sheet_analyzer/favicon.ico' %}">
    <link rel="stylesheet" href="{% static 'sheet_analyzer/style.css' %}">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { justify-content: center; align-items: center; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: rgba(0,255,224,0.6); text-decoration: none;
            font-size: 0.85rem; font-weight: 600;
            margin-bottom: 28px; transition: color 0.2s;
        }
        .back-link:hover { color: var(--color-primary); }
        .success-msg {
            display: flex; align-items: center; gap: 12px;
            padding: 14px 18px;
            background: rgba(16,185,129,0.1);
            border: 1.5px solid rgba(16,185,129,0.4);
            border-radius: 12px; color: #6ee7b7;
            font-size: 0.88rem; font-weight: 600;
            margin-bottom: 24px;
        }
    </style>
</head>
<body>

    <div id="aurora">
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
        <div class="aurora-band"></div>
    </div>

    <div class="login-wrap">

        <div class="login-logo" style="display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:28px;">
            <img class="brand-logo-img brand-logo-img-lg" src="{% static 'sheetai-logo.svg' %}" alt="SheetAnalyzer logo">
            <span class="logo-text" style="font-size:1.5rem;">Sheet<span class="logo-accent">Analyzer</span></span>
        </div>

        <a href="/" class="back-link">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back to Dashboard
        </a>

        <div class="login-heading">
            <h1 class="login-title">Change Password</h1>
            <p class="login-sub">Update your SheetAnalyzer account password</p>
        </div>

        {% if error %}
        <div class="login-error">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="success-msg">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            {{ success }}
        </div>
        {% endif %}

        <form method="post" class="login-form">
            {% csrf_token %}

            <div class="field-group">
                <label class="field-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Current Password
                </label>
                <input type="password" name="current_password" class="field-input"
                       placeholder="Enter current password" required autocomplete="current-password">
            </div>

            <div class="field-group">
                <label class="field-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    New Password
                </label>
                <input type="password" name="new_password" class="field-input"
                       placeholder="Enter new password (min 6 chars)" required autocomplete="new-password">
            </div>

            <div class="field-group">
                <label class="field-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                    </svg>
                    Confirm New Password
                </label>
                <input type="password" name="confirm_password" class="field-input"
                       placeholder="Confirm new password" required autocomplete="new-password">
            </div>

            <button type="submit" class="login-submit">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                </svg>
                Update Password
            </button>
        </form>

    </div>

    <script>
        // Auto-hide success after 3 seconds and redirect
        const msg = document.querySelector('.success-msg');
        if (msg) {
            setTimeout(() => { window.location.href = '/'; }, 2000);
        }
    </script>
</body>
</html>
